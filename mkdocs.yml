site_name: MSCompress Documentation
site_description: Documentation for MSCompress, a tool for compressing Mass Spectrometry data.
repo_url: https://github.com/chrisagrams/mscompress
repo_name: chrisagrams/mscompress

theme:
  name: material
  logo: https://raw.githubusercontent.com/chrisagrams/mscompress/refs/heads/main/electron/assets/logos/msc_logo.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - content.code.copy
  palette:
    - scheme: default
      primary: custom
      accent: custom
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra_css:
  - styles/extra.css

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [python]
          options:
            docstring_style: google  # Check if this matches your docstring style (Google/NumPy/Sphinx)
            show_source: true
            show_root_heading: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list

nav:
  - Home: index.md
  - Usage: usage.md
  - API Reference: api.md
