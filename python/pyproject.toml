[build-system]
requires = ["setuptools>=45", "wheel", "cython", "numpy>=2.0", "tomli"]
build-backend = "setuptools.build_meta"

[project]
name = "mscompress"
version = "1.0.15"
description = "Python bindings for mscompress, a compression library for mass spectrometry data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mlcroissant>=1.0.0",
    "numpy>=1.19",
    "zstandard>=0.19.0",
]

[project.optional-dependencies]
dev = [
    "setuptools>=45",
    "cython",
    "numpy",
    "pytest",
    "pytest-cov",
    "tomli"
]

pytorch = ["torch>=2.3; sys_platform != 'darwin' or platform_machine != 'x86_64'"]

parquet = ["pyarrow>=14"]

jax = ["jax>=0.4", "grain>=0.2"]

all = [
    "mlcroissant>=1.0.0",
    "numpy>=1.19",
    "zstandard>=0.19.0",
    "torch>=2.3; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "pyarrow>=14",
    "jax>=0.4",
    "grain>=0.2",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
"*" = ["*.pyx", "*.pxd", "*.c", "*.h", "*.pyi", "py.typed"]

[tool.cibuildwheel]
build = ["cp310-*", "cp311-*", "cp312-*", "cp313-*", "cp314-*"]
skip = ["*-musllinux_*"]
build-verbosity = 1

[tool.cibuildwheel.linux]
archs = ["x86_64"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]

[tool.coverage.run]
plugins = ["Cython.Coverage"]
