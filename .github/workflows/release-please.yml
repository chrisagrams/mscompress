name: Release Please

# Two-phase release flow (dev -> stage -> main):
#   push to dev:  open/update the release PR (targets dev). Never tags.
#   push to main: tag + GitHub Release for any merged release PR that has
#                 been promoted to main, then dispatch build.yml to publish.
on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # The default GITHUB_TOKEN is sufficient: we do NOT rely on the created tag
      # to trigger build.yml (GITHUB_TOKEN-created tags don't trigger workflows).
      # Instead the job below dispatches build.yml explicitly.
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Release PRs always live on dev, so both phases look at dev's PRs.
          target-branch: dev
          # Only tag/release from main (once the release PR has been promoted).
          skip-github-release: ${{ github.ref_name != 'main' }}
          # Only open/update the release PR from dev.
          skip-github-pull-request: ${{ github.ref_name != 'dev' }}

  build-and-publish:
    name: Build and Publish Release
    needs: release-please
    if: ${{ github.ref_name == 'main' && needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      # Start build.yml as its own top-level run rather than via workflow_call.
      # PyPI trusted publishing checks the attestation against the top-level
      # workflow and npm checks its OIDC claims the same way, so both expect
      # build.yml. GITHUB_TOKEN may trigger workflow_dispatch runs.
      - name: Dispatch build.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh workflow run build.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f publish=true \
            -f release_tag="$TAG"
