name: Release Please

# Two-phase release flow (dev -> stage -> main):
#   push to dev:  open/update the release PR (targets dev). Never tags.
#   push to main: tag + GitHub Release for any merged release PR that has
#                 been promoted to main, then dispatch build.yml to publish.
on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Use a GitHub App token, not GITHUB_TOKEN. The release is tagged at the
      # release commit on dev, and if a workflow change has been promoted to
      # main since then, that commit's .github/workflows/ differs from the
      # default branch. Creating a release there requires the Workflows
      # permission, which GITHUB_TOKEN can never have (fails with 403 "Resource
      # not accessible by integration"). build.yml is still started by the job
      # below via workflow_dispatch, not by the tag push.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          # Release PRs always live on dev, so both phases look at dev's PRs.
          target-branch: dev
          # Only tag/release from main (once the release PR has been promoted).
          skip-github-release: ${{ github.ref_name != 'main' }}
          # Only open/update the release PR from dev.
          skip-github-pull-request: ${{ github.ref_name != 'dev' }}

  build-and-publish:
    name: Build and Publish Release
    needs: release-please
    if: ${{ github.ref_name == 'main' && needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      # Start build.yml as its own top-level run rather than via workflow_call.
      # PyPI trusted publishing checks the attestation against the top-level
      # workflow and npm checks its OIDC claims the same way, so both expect
      # build.yml. GITHUB_TOKEN may trigger workflow_dispatch runs.
      - name: Dispatch build.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh workflow run build.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f publish=true \
            -f release_tag="$TAG"
