name: Build and Test

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'stage'
      - 'dev'
  workflow_dispatch:

jobs:
  build-cli:
    name: Build CLI - ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-latest
            arch: x86_64
          - platform: linux
            runner: ubuntu-24.04-arm
            arch: arm64
          - platform: windows
            runner: windows-latest
            arch: x86_64
          - platform: macos
            runner: macos-15-intel
            arch: x86_64
          - platform: macos
            runner: macos-latest
            arch: arm64
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Setup MSVC Developer Command Prompt (Windows)
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      
      - name: Configure CMake (Unix)
        if: matrix.platform != 'windows'
        working-directory: ./cli
        run: cmake -DENABLE_DEBUG_SYMBOLS=ON .
      
      - name: Configure CMake (Windows)
        if: matrix.platform == 'windows'
        working-directory: ./cli
        run: cmake -G "Visual Studio 17 2022" -A x64 -DENABLE_DEBUG_SYMBOLS=ON -S . -B build
      
      - name: Build CLI (Unix)
        if: matrix.platform != 'windows'
        working-directory: ./cli
        run: cmake --build . --config Release
      
      - name: Build CLI (Windows)
        if: matrix.platform == 'windows'
        working-directory: ./cli
        run: cmake --build build --config Release
      
      - name: Test CLI exists (Unix)
        if: matrix.platform != 'windows'
        working-directory: ./cli
        run: |
          ls -la mscompress || ls -la ./mscompress
          ./mscompress --help || true
      
      - name: Test CLI exists (Windows)
        if: matrix.platform == 'windows'
        working-directory: ./cli
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter "mscompress.exe"
          if (Test-Path "./build/Release/mscompress.exe") {
            ./build/Release/mscompress.exe --help
          } elseif (Test-Path "./Release/mscompress.exe") {
            ./Release/mscompress.exe --help
          } elseif (Test-Path "./mscompress.exe") {
            ./mscompress.exe --help
          }

      - name: Run CTest (Unix)
        if: matrix.platform != 'windows'
        working-directory: ./cli
        run: ctest --output-on-failure

      - name: Run CTest (Windows)
        if: matrix.platform == 'windows'
        working-directory: ./cli/build
        run: ctest -C Release --output-on-failure
      
      - name: Upload CLI artifact (Unix)
        if: matrix.platform != 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: mscompress-cli-${{ matrix.platform }}-${{ matrix.arch }}
          path: ./cli/mscompress
      
      - name: Upload CLI artifact (Windows)
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: mscompress-cli-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            ./cli/build/Release/mscompress.exe
            ./cli/Release/mscompress.exe
            ./cli/mscompress.exe

      - name: Prepare release binary (Unix)
        if: matrix.platform != 'windows' && startsWith(github.ref, 'refs/tags/v')
        working-directory: ./cli
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          mkdir -p release
          cp mscompress release/mscompress-cli-${VERSION}-${{ matrix.platform }}-${{ matrix.arch }}

      - name: Prepare release binary (Windows)
        if: matrix.platform == 'windows' && startsWith(github.ref, 'refs/tags/v')
        working-directory: ./cli
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          New-Item -ItemType Directory -Force -Path release
          if (Test-Path "./build/Release/mscompress.exe") {
            Copy-Item "./build/Release/mscompress.exe" "release/mscompress-cli-${version}-${{ matrix.platform }}-${{ matrix.arch }}.exe"
          } elseif (Test-Path "./Release/mscompress.exe") {
            Copy-Item "./Release/mscompress.exe" "release/mscompress-cli-${version}-${{ matrix.platform }}-${{ matrix.arch }}.exe"
          } elseif (Test-Path "./mscompress.exe") {
            Copy-Item "./mscompress.exe" "release/mscompress-cli-${version}-${{ matrix.platform }}-${{ matrix.arch }}.exe"
          }

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ./cli/release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-python:
    name: Build Python - ${{ matrix.runner }} ${{ matrix.cibw_arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            cibw_arch: x86_64
            os_name: Linux
          - runner: ubuntu-24.04-arm
            cibw_arch: aarch64
            os_name: Linux
          - runner: windows-latest
            cibw_arch: AMD64
            os_name: Windows
          - runner: macos-latest
            cibw_arch: arm64
            os_name: macOS
          - runner: macos-15-intel
            cibw_arch: x86_64
            os_name: macOS
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Setup MSVC Developer Command Prompt (Windows)
        if: matrix.os_name == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      
      - name: Generate config.h for base64
        run: python vendor/generate_config.py
      
      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21
        env:
          CIBW_BUILD: ${{ github.ref == 'refs/heads/dev' && 'cp312-*' || 'cp39-* cp310-* cp311-* cp312-* cp313-*' }}
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ARCHS: "${{ matrix.cibw_arch }}"
          # Use manylinux_2_28 so pre-built scipy wheels (required by mlcroissant) are available
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
          CIBW_BEFORE_BUILD: "python {package}/../vendor/generate_config.py"
          # Run tests inside cibuildwheel so each Python version is tested with its own wheel
          CIBW_TEST_REQUIRES: "pytest torch"
          CIBW_TEST_COMMAND: "cd {project}/python && pytest test -v"
          CIBW_TEST_COMMAND_WINDOWS: "cd /d {project}\\python && pytest test -v"
          CIBW_BUILD_VERBOSITY: 1
        with:
          package-dir: ./python
          output-dir: ./python/wheelhouse

      - name: Build source distribution
        if: matrix.runner == 'ubuntu-latest' && github.ref != 'refs/heads/dev'
        working-directory: ./python
        run: |
          python -m pip install build
          python -m build --sdist

      - name: List build artifacts
        working-directory: ./python
        shell: bash
        run: |
          echo "Contents of wheelhouse directory:"
          ls -la wheelhouse/ || true
          if [ -d "dist" ]; then
            echo "Contents of dist directory:"
            ls -la dist/ || true
          fi

      - name: Upload Python artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-${{ matrix.os_name }}-${{ matrix.cibw_arch }}
          path: |
            ./python/wheelhouse/*.whl
            ./python/dist/*.tar.gz

  publish-python:
    name: Publish Python Package to PyPI
    needs: build-python
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/mscompress
    permissions:
      id-token: write
    
    steps:
      - name: Download all Python artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: python-package-*
          merge-multiple: true
      
      - name: Prepare dist directory
        run: |
          # Consolidate all wheels and source dists into a single dist directory
          mkdir -p dist_combined
          find . -name "*.whl" -exec cp {} dist_combined/ \;
          find . -name "*.tar.gz" -exec cp {} dist_combined/ \;
          echo "Contents of dist_combined directory:"
          ls -la dist_combined/
      
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist_combined/

  build-docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Extract version from tag
        id: extract_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mscompress:${{ steps.extract_version.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/mscompress:latest
