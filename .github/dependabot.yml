# Dependabot version updates.
#
# PRs target dev (the integration branch); the repo default branch is main.
# PRs into dev are squash-merged with the PR title as the commit message, so
# every update uses a Conventional Commits prefix accepted by pr-title.yml.
# Updates to shipped dependencies use the `deps` type, which release-please
# lists under "Dependencies" and releases as a patch bump. Dev-only, CI and
# docs updates use chore/ci/docs, which are hidden and do not trigger a release.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]

  # Root package.json (husky git hooks only)
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: npm
    directory: /node
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
      prefix-development: chore
    groups:
      node-dev:
        dependency-type: development
        update-types: [minor, patch]
      node-prod:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /electron
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
      prefix-development: chore
    groups:
      electron-dev:
        dependency-type: development
        update-types: [minor, patch]
      electron-prod:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /python
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      python:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /docs
    target-branch: dev
    schedule:
      interval: monthly
    commit-message:
      prefix: docs
      include: scope
    groups:
      docs:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    commit-message:
      prefix: deps

  # Vendored C libraries (zstd, lz4, zlib, base64, c-blosc2)
  - package-ecosystem: gitsubmodule
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    commit-message:
      prefix: deps
